# Reproduction environment (versions used for the paper).
name: ooc1k
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11.15
  - pip
  - pip:
      - torch==2.10.0
      - torchvision==0.25.0
      - timm==1.0.26
      - numpy==2.4.3
      - pandas==2.3.3
      - scipy==1.17.1
      - matplotlib==3.10.8
      - statsmodels==0.14.6
      - scikit-learn==1.8.0
      - scikit-image==0.26.0
      - h5py==3.16.0
      - pillow==12.1.1
      - pyarrow==23.0.1
      - nltk==3.9.4
      - tqdm==4.67.3
      - zstandard==0.25.0
      - ipykernel
      - git+https://github.com/openai/CLIP.git
      - -e .
